version: '3.8'

services:
  compliance-agent:
    build: .
    container_name: talp-compliance-agent-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:///./storage/db/compliance_agent.db
      CATALOG_RULES_PATH: data/catalog_rules_v1.csv
      AUDIT_LOG_PATH: storage/audit/compliance_runs.jsonl
      AGENT_BACKEND: heuristic
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  streamlit:
    build: .
    container_name: talp-compliance-agent-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:///./storage/db/compliance_agent.db
      CATALOG_RULES_PATH: data/catalog_rules_v1.csv
      AUDIT_LOG_PATH: storage/audit/compliance_runs.jsonl
      AGENT_BACKEND: heuristic
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - compliance-agent
