services:
  workflow-frontend:
    build:
      context: ./talp-workflow-frontend
    container_name: talp-workflow-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_APP_NAME: TALP Workflow Frontend
      VITE_APP_VERSION: 0.1.0
      VITE_ORCHESTRATOR_BASE_URL: http://localhost:8000/api/v1
      # Legacy key kept during migration for compatibility with older code paths.
      VITE_ORCHESTRATOR_API_BASE_URL: http://localhost:8000/api/v1
      VITE_REQUEST_TIMEOUT_MS: "240000"
      VITE_ENABLE_MOCKS: "false"
    depends_on:
      - workflow-orchestrator

  workflow-orchestrator:
    build:
      context: ./talp-workflow-orchestrator
    container_name: talp-workflow-orchestrator
    ports:
      - "8000:8000"
    environment:
      ORCH_APP_NAME: Workflow Orchestrator
      ORCH_APP_VERSION: 0.1.0
      ORCH_API_PREFIX: /api/v1
      ORCH_LOG_LEVEL: INFO
      ORCH_USER_AGENT: talp-workflow-orchestrator/0.1.0
      ORCH_INVEST_AGENT_BASE_URL: http://invest-agent:8000/api/v1/invest
      ORCH_COMPLIANCE_AGENT_BASE_URL: http://compliance-agent:8000/api/v1/compliance
      ORCH_BDD_AGENT_BASE_URL: http://bdd-agent:8000/api/v1/qa
      # Timeout settings (seconds)
      ORCH_REQUEST_TIMEOUT_SECONDS: "240"
      ORCH_CONNECT_TIMEOUT_SECONDS: "5"
      ORCH_READ_TIMEOUT_SECONDS: "180"
      ORCH_WRITE_TIMEOUT_SECONDS: "180"
      ORCH_POOL_TIMEOUT_SECONDS: "5"
      # Retry settings
      ORCH_RETRY_ATTEMPTS: "0"
      ORCH_RETRY_BACKOFF_SECONDS: "0.5"
      ORCH_RETRY_MAX_BACKOFF_SECONDS: "5"
      ORCH_RETRY_JITTER_SECONDS: "0.2"
    depends_on:
      - invest-agent
      - compliance-agent
      - bdd-agent

  invest-agent:
    build:
      context: ./talp-invest-agent
    container_name: talp-invest-agent
    ports:
      - "8001:8000"
    environment:
      # Set to "llm" to use Google Gemini. Requires GOOGLE_API_KEY below.
      # Set to "heuristic" to run without any LLM (safe default for bring-up).
      TALP_BACKEND: llm
      TALP_LLM_MODEL: gemini-2.5-flash
      TALP_AUDIT_LOG_DIR: /app/logs/audit
      # Required when TALP_BACKEND=llm. Set in your shell or a .env file at repo root.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?GOOGLE_API_KEY is required for Gemini agents}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./talp-invest-agent/logs:/app/logs

  compliance-agent:
    build:
      context: ./talp-compliance-agent
    container_name: talp-compliance-agent
    ports:
      - "8002:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "false"
      DATABASE_URL: sqlite:///./storage/db/compliance_agent.db
      CATALOG_RULES_PATH: data/catalog_rules_v1.csv
      AUDIT_LOG_PATH: storage/audit/compliance_runs.jsonl
      AGENT_BACKEND: heuristic
      LOG_LEVEL: INFO
      LOG_FILE: ./storage/logs/app.log
    volumes:
      - ./talp-compliance-agent/data:/app/data
      - ./talp-compliance-agent/storage:/app/storage

  bdd-agent:
    build:
      context: ./talp-bdd-agent
    container_name: talp-bdd-agent
    ports:
      - "8003:8000"
    environment:
      QA_APP_NAME: BDD QA Agent
      QA_APP_VERSION: 0.1.0
      QA_API_PREFIX: /api/v1
      QA_LOG_LEVEL: INFO
      # Gemini model served through Google's OpenAI-compatible endpoint.
      QA_LLM_MODEL: gemini-2.5-flash
      QA_LLM_TEMPERATURE: "0.0"
      QA_LLM_TIMEOUT_SECONDS: "120"
      # Centralized key shared across agents.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?GOOGLE_API_KEY is required for Gemini agents}
      # Optional per-agent override (leave empty to use GOOGLE_API_KEY fallback).
      QA_LLM_API_KEY: ${QA_LLM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      QA_LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai

networks:
  default:
    name: talp-agents-network
